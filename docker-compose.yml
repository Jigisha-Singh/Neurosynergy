services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eeg_seizure_db
      POSTGRES_USER: eeg_user
      POSTGRES_PASSWORD: eeg_password
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
